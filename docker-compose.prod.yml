services:
  web:
    image: seo-reports-app:production
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    ports:
      - "8080:80"
    env_file:
      - ./backend/.env.production.example
    depends_on:
      - postgres
      - redis

  worker:
    image: seo-reports-app:production
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file:
      - ./backend/.env.production.example
    depends_on:
      - web
      - redis

  scheduler:
    image: seo-reports-app:production
    command: php artisan schedule:work
    env_file:
      - ./backend/.env.production.example
    depends_on:
      - web

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seo_reports
      POSTGRES_USER: seo_reports
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  postgres_prod_data:

# Reference compose for Coolify deployment.
# In Coolify: create 3 applications (web, worker, scheduler) from the same Dockerfile target=production.
